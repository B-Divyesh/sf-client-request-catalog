[package]
name = "client-request-catalog-server"
version = "1.0.0"
edition = "2021"

[dependencies]
argon2 = "0.5.3"
axum = "0.7.9"
chrono = { version = "0.4.39", features = ["serde"] }
rand = "0.8.5"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
sqlx = { version = "0.8.3", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "signal", "fs"] }
tower-http = { version = "0.6.2", features = ["fs", "set-header", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
tower = { version = "0.5.2", features = ["util"] }

[dev-dependencies]
tempfile = "3.15.0"
